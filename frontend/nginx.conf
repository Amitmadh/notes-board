# Upgrades a request to a WebSocket only when it asks to be one
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Sign-in and registration attempts, counted per address
limit_req_zone $binary_remote_addr zone=sign_in:10m rate=5r/s;

# A board's room lives in one backend's memory, so every request about a board
# goes to the backend its id hashes to. If that backend is down, its boards wait
# for it (max_fails=0 and no retry below) rather than move, so a board is never
# open on two backends.
#
# To add a backend: in compose.yaml, add `backend2: *backend` to the services and
# backend2 to the frontend's depends_on; add `server backend2:8000 max_fails=0;`
# here and `server backend2:8000;` to any_server; then run
# `docker compose up -d --build`. nginx restarts, so open boards reconnect, and
# only the boards that now hash to backend2 move.
upstream board_server {
    hash $board_id consistent;
    server backend:8000 max_fails=0;
}

# Everything else can go to any backend
upstream any_server {
    server backend:8000;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://any_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # images can be 10 MB, plus the form around them
        client_max_body_size 11m;

        location ~ ^/api/boards/(?<board_id>\d+) {
            proxy_pass http://board_server;
            proxy_next_upstream off;
        }

        # 5 attempts a second, after a burst of 5, so passwords can't be guessed fast
        location ~ ^/api/(login|register)$ {
            limit_req zone=sign_in burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://any_server;
        }
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
